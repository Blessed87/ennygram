<title>Nathan Richard Sichone | Ennygram Smart Tech Solutions</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#0b1628;--navy2:#13243d;--gold:#b8923f;--gold2:#e0c47a;--bg:#f7f4ec;--card:#fff;--ink:#16202f;--mute:#5b6577;--line:#e3dcc8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a2c;--card:#15233a;--ink:#eee8d8;--mute:#a7b0bf;--line:#2c3b55}}
:root[data-theme="dark"]{--bg:#0e1a2c;--card:#15233a;--ink:#eee8d8;--mute:#a7b0bf;--line:#2c3b55}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16.5px/1.7 Manrope,system-ui,sans-serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0;line-height:1.15;font-weight:600}
a{color:inherit}:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(11,22,40,.96);border-bottom:1px solid rgba(224,196,122,.4);backdrop-filter:blur(8px)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;min-height:66px;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand svg{width:38px;height:40px}
.brand b{font:600 1.2rem 'Playfair Display',serif;color:var(--gold2);display:block;line-height:1.1}
.brand span{font-size:.68rem;color:#aab4c4;letter-spacing:.14em;text-transform:uppercase}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:#d6dbe5;text-decoration:none;font-size:.92rem;font-weight:500;padding:8px 14px;border-radius:99px}
nav a:hover{color:#fff}nav a.on{background:rgba(224,196,122,.15);color:var(--gold2)}
.hero{background:radial-gradient(900px 400px at 85% 0,#1d3556 0,transparent 70%),var(--navy);color:#eef0f4;padding:80px 0 96px}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:56px;align-items:center}
.tag{display:inline-block;border:1px solid rgba(224,196,122,.5);color:var(--gold2);padding:5px 14px;border-radius:99px;font-size:.82rem;margin-bottom:22px}
.hero h1{font-size:clamp(2.5rem,5.6vw,4.2rem);color:#fff}
.hero h1 em{font-style:italic;color:var(--gold2)}
.hero p{color:#c3cad8;max-width:54ch;margin:22px 0 32px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 26px;border-radius:99px;text-decoration:none;font-weight:600;font-size:.95rem;border:1px solid var(--gold);transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn.g{background:linear-gradient(135deg,#e0c47a,#b8923f);color:#0b1628}
.btn.o{color:var(--gold2)}.btn.o:hover{background:rgba(224,196,122,.12)}
.arch{position:relative;max-width:340px;justify-self:center;margin:0 18px 18px 0}
.arch::before{content:"";position:absolute;inset:18px -18px -18px 18px;background:linear-gradient(135deg,#e0c47a,#b8923f);border-radius:6px}
.arch img{position:relative;display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 18%;border-radius:6px;border:6px solid var(--bg);outline:1px solid rgba(224,196,122,.6)}
.hero .arch img{border-color:var(--navy)}
.appvis{display:flex;justify-content:center;align-items:flex-end;height:300px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#1d3556,#0b1628)}
.appvis .phone{width:190px;margin:30px 0 0;border-radius:32px 32px 0 0;padding:9px 9px 0}
.appvis .phone img{border-radius:24px 24px 0 0}
.show{margin-top:56px;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:40px 32px}
.page-head{background:var(--navy);color:#fff;padding:56px 0 60px;border-bottom:3px solid var(--gold)}
.page-head p{color:#b9c2d1;max-width:58ch;margin:12px 0 0}
.page-head h1{font-size:clamp(2.1rem,4.5vw,3.2rem)}
section{padding:72px 0}
h2{font-size:clamp(1.8rem,3.5vw,2.5rem);margin-bottom:12px}
.sub{color:var(--mute);max-width:58ch;margin:0 0 36px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card .body{padding:22px 24px 26px}
.card h3{font-size:1.35rem;margin-bottom:8px}
.card p{margin:0 0 12px;color:var(--mute);font-size:.95rem}
.card ul{margin:0;padding:0;list-style:none}
.card li{font-size:.92rem;padding:5px 0 5px 20px;position:relative}
.card li::before{content:"";position:absolute;left:2px;top:13px;width:7px;height:7px;background:var(--gold);border-radius:50%}
.art{display:block;width:100%;height:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;margin-top:-48px;position:relative}
.stats div{padding:24px 20px;border-right:1px solid var(--line)}.stats div:last-child{border:0}
.stats h3{font-size:1.15rem;color:var(--gold)}.stats p{margin:4px 0 0;font-size:.88rem;color:var(--mute);line-height:1.5}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.chips span{border:1px solid var(--line);background:var(--card);padding:7px 16px;border-radius:99px;font-size:.88rem}
.phone{width:min(290px,100%);margin:0 auto;padding:11px;border-radius:42px;background:linear-gradient(145deg,#2a3850,#0b1628);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.phone img{display:block;width:100%;height:auto;border-radius:32px}
.cta{background:var(--navy);color:#fff;text-align:center;padding:70px 24px}
.cta h2{color:#fff}.cta p{color:#b9c2d1;margin:0 0 26px}
dl.info{margin:0;border-top:2px solid var(--gold)}
dl.info div{display:grid;grid-template-columns:140px 1fr;padding:18px 0;border-bottom:1px solid var(--line)}
dl.info dt{font:600 1.1rem 'Playfair Display',serif}dl.info dd{margin:0}
dl.info a{text-decoration:none;border-bottom:1px solid var(--gold)}
footer{background:var(--navy);color:#a9b3c4;padding:36px 24px;text-align:center;font-size:.9rem;border-top:1px solid rgba(224,196,122,.4)}
footer svg{width:44px;height:46px}footer b{display:block;font:600 1.15rem 'Playfair Display',serif;color:var(--gold2)}
@media(max-width:840px){.hero .wrap,.split{grid-template-columns:1fr;gap:40px}.arch{order:-1;max-width:260px}.show{padding:28px 20px}
.grid3{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats div:nth-child(2){border-right:0}.stats div:nth-child(-n+2){border-bottom:1px solid var(--line)}
.hero{padding:48px 0 76px}section{padding:52px 0}dl.info div{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    net: <><g stroke={g} strokeWidth="2.5"><path d="M200 120L90 60M200 120L310 60M200 120L90 190M200 120L310 190M90 60L90 190M310 60L310 190"/></g><circle cx="200" cy="120" r="26" fill={g}/><circle cx="200" cy="120" r="10" fill="#0b1628"/>{[[90,60],[310,60],[90,190],[310,190]].map((p,i)=><circle key={i} cx={p[0]} cy={p[1]} r="16" fill="#0b1628" stroke={b} strokeWidth="4"/>)}</>
  };
  return <svg className="art" viewBox="0 0 400 240" role="img" aria-hidden="true"><rect width="400" height="240" fill="url(#bg)"/>{scenes[k]}</svg>;
};

const services = [
  { k:"app", t:"Custom Applications", d:"Desktop and mobile apps built around how you actually work.", i:["Custom desktop and mobile apps","App maintenance and updates","Bug fixing and performance tuning"] },
  { k:"sys", t:"Business Management Systems", d:"Run sales, stock, staff and reports from one dependable system.", i:["Business and management systems","Reports and dashboards","Training for your team"] },
  { k:"web", t:"Website Creation", d:"Modern, responsive sites that look sharp on every screen.", i:["Business and portfolio sites","E-commerce stores","Updates and maintenance"] },
  { k:"tune", t:"SEO and Performance", d:"Faster pages and better visibility on search engines.", i:["SEO optimization","Speed and performance tuning","Ongoing improvements"] },
  { k:"it", t:"System Setup and IT Support", d:"Get your equipment installed, configured and running smoothly.", i:["System installation and configuration","IT support and troubleshooting","Fast issue resolution"] },
  { k:"net", t:"Networking and Consultation", d:"Reliable networks and practical advice for your next step.", i:["Network setup and maintenance","Technology consultation","Training and guidance"] },
];
const pages = [["/","Home"],["/about","About"],["/services","Services"],["/contact","Contact"]];

const Head = ({ t, p }) => <div className="page-head"><div className="wrap"><h1>{t}</h1><p>{p}</p></div></div>;
const Cta = () => <div className="cta"><h2>Let's build something great together</h2><p>Tell me about your idea and I will reply with a clear plan.</p><a className="btn g" href={"https://wa.me/"+WA} target="_blank" rel="noopener">Chat on WhatsApp</a></div>;
const Service = ({ s }) => <article className="card">{s.k==="app" ? <div className="appvis"><div className="phone"><img src={APP} alt="Mobile app dashboard screenshot"/></div></div> : <Art k={s.k}/>}<div className="body"><h3>{s.t}</h3><p>{s.d}</p><ul>{s.i.map(x=><li key={x}>{x}</li>)}</ul></div></article>;

const Home = () => <>
  <div className="hero"><div className="wrap">
    <div>
      <span className="tag">Ennygram Smart Tech Solutions</span>
      <h1>Smart tech solutions that <em>power your ideas</em></h1>
      <p>I'm Nathan Richard Sichone. I help individuals, businesses and organizations go digital, stay efficient and achieve more, with reliable software, websites and IT services.</p>
      <div className="btns"><a className="btn g" href="#/services">Explore services</a><a className="btn o" href="#/contact">Get in touch</a></div>
    </div>
    <div className="arch"><img src={ME} alt="Nathan Richard Sichone in a white shirt and black tie"/></div>
  </div></div>
  <div className="wrap"><div className="stats">
    {[["Innovation","Fresh ideas turned into working software."],["Secure and reliable","Systems you can depend on."],["On-time delivery","Projects finished when promised."],["Client satisfaction","Support continues after launch."]].map(x=><div key={x[0]}><h3>{x[0]}</h3><p>{x[1]}</p></div>)}
  </div></div>
  <section><div className="wrap">
    <h2>What I do</h2><p className="sub">From a first idea to a finished product, apps, websites and everyday IT.</p>
    <div className="grid3">{services.slice(0,3).map(s=><Service key={s.k} s={s}/>)}</div>
    <p style={{marginTop:28}}><a className="btn o" style={{color:"var(--gold)"}} href="#/services">See all services</a></p>
  </div></section>
  <Cta/>
</>;

const About = () => <>
  <Head t="About Nathan" p="Founder of Ennygram Smart Tech Solutions. Your vision, my code, our future."/>
  <section><div className="wrap split">
    <div className="arch" style={{borderColor:"var(--gold)"}}><img src={ME} alt="Portrait of Nathan Richard Sichone"/></div>
    <div>
      <h2>Technology made simple</h2>
      <p>I build software and websites that fit real needs. Every project starts with listening, so the result is practical, secure and easy for your team or customers to use.</p>
      <p>I work with individuals, growing businesses and organizations, and I stay available after launch for updates, fixes and training.</p>
      <div className="chips">{["Desktop apps","Mobile apps","Management systems","Websites","E-commerce","SEO","IT support","Networking","Training"].map(x=><span key={x}>{x}</span>)}</div>
    </div>
  </div></section>
  <Cta/>
</>;

const Services = () => <>
  <Head t="Services" p="Applications, websites and IT services, including mobile apps like the example below."/>
  <section><div className="wrap"><div className="grid3">{services.map(s=><Service key={s.k} s={s}/>)}</div>
    <div className="show split" id="mobile">
      <div className="phone"><img src={APP} alt="Farm dashboard app showing a field vitality score of 88, rover battery at 92 percent and a patrol path"/></div>
      <div>
        <h2>Mobile app example: farm monitoring</h2>
        <p>One clear screen shows field health, an autonomous rover's battery and status, and the live patrol path across the plot.</p>
        <ul style={{paddingLeft:20}}><li>Field Vitality Index scored out of 100</li><li>Rover status, battery level and telemetry sync</li><li>Bottom navigation for Reports, Suggestions, Alerts and Profile</li></ul>
        <div className="chips"><span>Mobile</span><span>Dashboards</span><span>Real-time data</span></div>
      </div>
    </div></div></section>
  <Cta/>
</>;

const Contact = () => <>
  <Head t="Contact" p="Share your idea and I'll get back to you quickly."/>
  <section><div className="wrap" style={{maxWidth:760}}>
    <dl className="info">
      <div><dt>WhatsApp</dt><dd><a href={"https://wa.me/"+WA} target="_blank" rel="noopener">+255 676 213 262</a></dd></div>
      <div><dt>Email</dt><dd><a href={"mailto:"+EMAIL}>{EMAIL}</a></dd></div>
      <div><dt>Instagram</dt><dd><a href="https://instagram.com/2687_programmer" target="_blank" rel="noopener">@2687_programmer</a></dd></div>
      <div><dt>TikTok</dt><dd><a href="https://www.tiktok.com/@2687Nerat" target="_blank" rel="noopener">@2687Nerat</a></dd></div>
    </dl>
    <div className="btns" style={{marginTop:30}}><a className="btn g" href={"https://wa.me/"+WA} target="_blank" rel="noopener">Message on WhatsApp</a><a className="btn o" style={{color:"var(--gold)"}} href={"mailto:"+EMAIL}>Send an email</a></div>
  </div></section>
</>;

const routes = { "/":Home, "/about":About, "/services":Services, "/contact":Contact };
const route = () => { const r = location.hash.replace("#",""); return routes[r] ? r : "/"; };

function App() {
  const [r, setR] = useState(route());
  useEffect(() => { const f = () => { setR(route()); window.scrollTo(0,0); }; window.addEventListener("hashchange", f); return () => window.removeEventListener("hashchange", f); }, []);
  useEffect(() => { const n = pages.find(p=>p[0]===r)[1]; document.title = (r==="/" ? "" : n+" | ") + "Nathan Richard Sichone | Ennygram"; }, [r]);
  const Page = routes[r];
  return <>
    <svg width="0" height="0" style={{position:"absolute"}} aria-hidden="true"><defs>
      <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#f0d98f"/><stop offset="1" stopColor="#b8923f"/></linearGradient>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#16294a"/><stop offset="1" stopColor="#0b1628"/></linearGradient>
    </defs></svg>
    <header className="top"><div className="wrap">
      <a className="brand" href="#/"><Logo/><div><b>Ennygram</b><span>Smart Tech Solutions</span></div></a>
      <nav aria-label="Main">{pages.map(p=><a key={p[0]} href={"#"+p[0]} className={r===p[0]?"on":""}>{p[1]}</a>)}</nav>
    </div></header>
    <main><Page/></main>
    <footer><Logo/><b>Ennygram Smart Tech Solutions</b>Tech Made Simple. &copy; {new Date().getFullYear()} Nathan Richard Sichone</footer>
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
